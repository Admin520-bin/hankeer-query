<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瀚客尔产品查询器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
.container { max-width: 960px; margin: 0 auto; }
h1 { text-align: center; color: #1a1a1a; margin-bottom: 6px; font-size: 24px; }
.subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
.search-box { display: flex; gap: 10px; margin-bottom: 20px; }
.search-box input { flex: 1; padding: 12px 16px; border: 2px solid #d9d9d9; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
.search-box input:focus { border-color: #1890ff; }
.search-box button { padding: 12px 28px; background: #1890ff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
.search-box button:hover { background: #40a9ff; }
.hint { text-align: center; color: #bbb; margin-bottom: 18px; font-size: 13px; }
.result-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.result-card h3 { color: #1890ff; margin-bottom: 12px; font-size: 18px; border-bottom: 2px solid #e8e8e8; padding-bottom: 8px; }
.badge-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.badge-regular { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
.badge-fleece { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
.badge-note { color: #999; font-size: 12px; }
.section { margin-top: 12px; padding: 14px; border-radius: 8px; }
.section-regular { background: #f0f8ff; border: 1px solid #d6e8ff; }
.section-fleece { background: #fffaf0; border: 1px solid #ffe8cc; }
.section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.section-regular .section-title { color: #1890ff; }
.section-fleece .section-title { color: #fa8c16; }
.info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.info-label { color: #888; }
.info-value { color: #333; font-weight: 500; }
.price-value { color: #f5222d; font-weight: 700; }
.stock-value { color: #52c41a; }
.link-box { margin-top: 10px; padding: 8px 12px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px; word-break: break-all; font-size: 13px; }
.link-box a { color: #52c41a; text-decoration: none; }
.link-box a:hover { text-decoration: underline; }
.copy-btn { display: block; width: 100%; padding: 11px; margin-top: 14px; background: #52c41a; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.3s; font-weight: 500; }
.copy-btn:hover { background: #73d13d; }
.no-result { text-align: center; color: #bbb; padding: 50px 20px; font-size: 15px; }
@media (max-width: 600px) {
  body { padding: 10px; }
  h1 { font-size: 20px; }
  .search-box { flex-direction: column; }
  .search-box button { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
  <h1>瀚客尔产品查询器</h1>
  <div class="subtitle">数据来源：瀚客尔26春夏新款（更新6.12）& 瀚客尔26春秋冬款（更新6.6）</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入款号（如 707、2806）或关键词（如 华棉、冰丝、西裤）" />
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="hint">支持款号精确搜索，也支持品名/面料/品类关键词模糊搜索 · 一键复制发客户</div>
  <div id="results"></div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
