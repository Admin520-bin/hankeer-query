<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>瀚客尔产品查询器 V2</title>
<style>
:root{
  --ios-bg:#f2f2f7;
  --ios-card:#ffffff;
  --ios-card-elevated:#ffffff;
  --ios-text:#000000;
  --ios-text-sub:#6c6c70;
  --ios-text-light:#8e8e93;
  --ios-blue:#007aff;
  --ios-blue-light:#e5f1ff;
  --ios-green:#34c759;
  --ios-green-light:#e6f9ea;
  --ios-orange:#ff9500;
  --ios-orange-light:#fff4e5;
  --ios-purple:#af52de;
  --ios-red:#ff3b30;
  --ios-gray:#8e8e93;
  --ios-gray2:#aeaeb2;
  --ios-gray5:#e5e5ea;
  --ios-gray6:#f2f2f7;
  --ios-separator:#e5e5ea;
  --ios-shadow:0 2px 12px rgba(0,0,0,0.08);
  --ios-shadow-lg:0 8px 30px rgba(0,0,0,0.12);
  --ios-radius:18px;
  --ios-radius-sm:12px;
  --ios-radius-xs:8px;
}
[data-theme="dark"]{
  --ios-bg:#000000;
  --ios-card:#1c1c1e;
  --ios-card-elevated:#2c2c2e;
  --ios-text:#ffffff;
  --ios-text-sub:#98989d;
  --ios-text-light:#636366;
  --ios-blue:#0a84ff;
  --ios-blue-light:#1c2c4e;
  --ios-green:#30d158;
  --ios-green-light:#1a3a25;
  --ios-orange:#ff9f0a;
  --ios-orange-light:#3d2a0a;
  --ios-purple:#bf5af2;
  --ios-red:#ff453a;
  --ios-gray:#8e8e93;
  --ios-gray2:#636366;
  --ios-gray5:#38383a;
  --ios-gray6:#2c2c2e;
  --ios-separator:#38383a;
  --ios-shadow:0 2px 12px rgba(0,0,0,0.3);
  --ios-shadow-lg:0 8px 30px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--ios-bg);
  color:var(--ios-text);
  padding:0;
  max-width:960px;
  margin:0 auto;
  line-height:1.47059;
  letter-spacing:-0.022em;
  transition:background .25s,color .25s;
}
.container{max-width:900px;margin:0 auto;padding:16px}

/* iOS 顶栏 */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  padding:0 4px;
}
.top-bar h1{
  font-size:28px;
  font-weight:700;
  color:var(--ios-text);
  letter-spacing:-0.021em;
}
.top-icons{
  display:flex;
  gap:10px;
}
.top-icon-btn{
  width:36px;
  height:36px;
  border:none;
  background:var(--ios-gray6);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--ios-blue);
  transition:all .2s;
}
.top-icon-btn:active{transform:scale(0.92);opacity:0.7}
.top-icon-btn.active{background:var(--ios-blue);color:#fff}

/* iOS 搜索 */
.search-wrap{
  background:var(--ios-card);
  border-radius:var(--ios-radius);
  padding:16px;
  margin-bottom:16px;
  box-shadow:var(--ios-shadow);
}
.search-row{
  display:flex;
  gap:10px;
  align-items:center;
}
#searchBox{
  flex:1;
  padding:13px 16px;
  border:none;
  border-radius:var(--ios-radius-sm);
  font-size:17px;
  outline:none;
  background:var(--ios-gray6);
  color:var(--ios-text);
  transition:background .2s;
}
#searchBox:focus{background:var(--ios-gray5)}
#searchBox::placeholder{color:var(--ios-gray)}
.btn{
  padding:13px 20px;
  border:none;
  border-radius:var(--ios-radius-sm);
  font-size:17px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(0.96)}
.btn-search{
  background:var(--ios-blue);
  color:#fff;
}
.btn-clear{
  background:var(--ios-gray6);
  color:var(--ios-blue);
}
.filter-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  font-size:15px;
  color:var(--ios-blue);
  cursor:pointer;
  user-select:none;
  font-weight:500;
}
.filter-panel{
  background:var(--ios-gray6);
  border-radius:var(--ios-radius-sm);
  padding:14px;
  margin-top:12px;
  display:none;
  animation:iosSlide .25s cubic-bezier(0.32,0.72,0,1);
}
.filter-panel.show{display:block}
@keyframes iosSlide{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
.filter-group{margin-bottom:14px}
.filter-group:last-child{margin-bottom:0}
.filter-label{
  font-size:13px;
  color:var(--ios-text-sub);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.03em;
  margin-bottom:8px;
  display:block;
}
.filter-tags{display:flex;flex-wrap:wrap;gap:8px}
.filter-tag{
  padding:6px 14px;
  border:1px solid var(--ios-separator);
  background:var(--ios-card);
  border-radius:20px;
  font-size:15px;
  cursor:pointer;
  color:var(--ios-text);
  font-weight:500;
  transition:all .15s;
}
.filter-tag:active{transform:scale(0.95)}
.filter-tag.active{
  background:var(--ios-blue);
  color:#fff;
  border-color:var(--ios-blue);
}
.filter-actions{display:flex;gap:10px;margin-top:14px}
.filter-actions .btn{flex:1;padding:12px;font-size:15px}

/* iOS 分段导航 */
.nav-area{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:16px;
  padding:0 4px;
}
.nav-btn{
  padding:10px 4px;
  border:none;
  background:var(--ios-gray6);
  border-radius:12px;
  font-size:13px;
  cursor:pointer;
  color:var(--ios-text);
  font-weight:600;
  transition:all .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:48px;
  line-height:1.2;
}
.nav-btn:active{transform:scale(0.95)}
.nav-btn.active{
  background:var(--ios-blue);
  color:#fff;
}
.nav-btn.nav-highlight{
  background:linear-gradient(135deg,#34c759,#1a9e3e);
  color:#fff;
  border-color:transparent;
}
.nav-btn.nav-highlight.active{
  background:linear-gradient(135deg,#1a9e3e,#0a8a2e);
  box-shadow:0 2px 10px rgba(52,199,89,.5);
}
.nav-btn .nav-icon{font-size:16px}

@media(max-width:360px){
  .nav-btn{font-size:12px;padding:8px 2px;min-height:42px}
}

/* 统计栏 */
.total-bar{
  text-align:center;
  padding:4px 0 12px;
  font-size:15px;
  color:var(--ios-text-sub);
}
.total-num{
  color:var(--ios-text);
  font-weight:700;
  font-size:17px;
}

/* iOS 卡片 */
.card{
  background:var(--ios-card);
  border-radius:var(--ios-radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--ios-shadow);
  transition:transform .2s,box-shadow .2s;
  animation:cardIn .35s cubic-bezier(0.32,0.72,0,1);
}
.card:active{transform:scale(0.99)}
.card.highlight{
  box-shadow:0 0 0 3px var(--ios-blue),var(--ios-shadow-lg);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(12px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.sn-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.sn-left{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.sn-text{
  font-size:22px;
  font-weight:700;
  color:var(--ios-text);
  letter-spacing:-0.021em;
}
.variant-hint{
  font-size:13px;
  color:var(--ios-text-sub);
}
.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
  color:#fff;
}
.badge-top{background:linear-gradient(135deg,#ff9500,#ff3b30)}
.badge-summer{background:linear-gradient(135deg,#ff9f0a,#ff6b00)}
.badge-autumn{background:linear-gradient(135deg,#af52de,#ff2d55)}
.badge-unshipped{background:linear-gradient(135deg,#8e8e93,#636366);color:#fff}
.badge-autumnnew{background:linear-gradient(135deg,#34c759,#1a9e3e);color:#fff}
.sn-actions{display:flex;gap:6px}
.icon-btn{
  width:32px;
  height:32px;
  border:none;
  background:var(--ios-gray6);
  border-radius:50%;
  cursor:pointer;
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ios-blue);
  transition:all .15s;
}
.icon-btn:active{transform:scale(0.9)}

/* 产品区块 */
.section{
  background:var(--ios-gray6);
  border-radius:var(--ios-radius-sm);
  padding:14px;
  margin-bottom:10px;
}
.section.fleece{
  background:var(--ios-orange-light);
}
.name-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.name-text{
  font-size:17px;
  font-weight:600;
  color:var(--ios-text);
}
.type-tag{
  padding:3px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
}
.type-reg{background:var(--ios-blue-light);color:var(--ios-blue)}
.type-fl{background:var(--ios-orange-light);color:var(--ios-orange)}
.info-row{
  display:flex;
  padding:4px 0;
  font-size:15px;
  line-height:1.5;
}
.info-label{
  width:56px;
  color:var(--ios-text-sub);
  flex-shrink:0;
  font-weight:500;
}
.info-value{
  flex:1;
  word-break:break-all;
  color:var(--ios-text);
}
.price-supply{color:var(--ios-blue);font-weight:700}
.price-ctrl{color:var(--ios-red);font-weight:700}
.link-row{
  background:var(--ios-green-light);
  border-radius:var(--ios-radius-xs);
  padding:10px 12px;
  margin-top:8px;
  font-size:14px;
  word-break:break-all;
}
.link-row a{
  color:var(--ios-green);
  text-decoration:none;
  font-weight:500;
}
.pwd-tag{
  color:var(--ios-red);
  font-weight:700;
}

/* 复制按钮 */
.copy-bar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.copy-btn{
  padding:12px 4px;
  border:none;
  border-radius:var(--ios-radius-sm);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:transform .15s,opacity .15s;
  white-space:nowrap;
}
.copy-btn:active{transform:scale(0.97)}
.copy-all{
  background:var(--ios-green);
  color:#fff;
}
.copy-share{
  background:var(--ios-blue);
  color:#fff;
}
.copy-link{
  background:var(--ios-purple);
  color:#fff;
}

/* 空状态 */
.empty{
  text-align:center;
  color:var(--ios-text-sub);
  padding:60px 20px;
  font-size:17px;
}

/* 返回顶部 */
.back-top{
  position:fixed;
  bottom:24px;
  right:24px;
  width:46px;
  height:46px;
  background:var(--ios-card-elevated);
  color:var(--ios-blue);
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
  box-shadow:var(--ios-shadow-lg);
  display:none;
  z-index:50;
  transition:transform .2s;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.back-top:active{transform:scale(0.92)}
.back-top.show{display:flex;align-items:center;justify-content:center}

/* 弹窗 */
.copy-overlay,.pwd-overlay{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  z-index:9999;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  animation:fadeIn .2s;
}
.copy-overlay{
  align-items:center;
  padding:20px;
}
.copy-dialog,.pwd-box{
  background:var(--ios-card);
  max-width:100%;
  width:100%;
  max-height:80%;
  overflow:auto;
  padding:20px;
  border-radius:var(--ios-radius);
  box-shadow:var(--ios-shadow-lg);
}
.pwd-box{
  max-width:320px;
  text-align:center;
  border-radius:var(--ios-radius);
}
.pwd-box h3{margin-bottom:16px;font-size:18px;font-weight:600}
.pwd-box input{
  width:100%;
  padding:14px;
  border:1px solid var(--ios-separator);
  border-radius:var(--ios-radius-sm);
  font-size:17px;
  text-align:center;
  margin-bottom:14px;
  background:var(--ios-gray6);
  color:var(--ios-text);
}
.pwd-box .btn{width:100%;padding:14px;font-size:17px}
.copy-dialog-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.copy-dialog-title{font-size:18px;font-weight:700}
.copy-dialog-close{
  cursor:pointer;
  font-size:28px;
  color:var(--ios-text-sub);
  background:none;
  border:none;
  line-height:1;
}
.copy-format-tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.format-tab{
  padding:8px 16px;
  border:none;
  background:var(--ios-gray6);
  border-radius:var(--ios-radius-xs);
  font-size:14px;
  cursor:pointer;
  color:var(--ios-text);
  font-weight:500;
}
.format-tab.active{background:var(--ios-blue);color:#fff}
.copy-textarea{
  width:100%;
  min-height:200px;
  padding:12px;
  border:1px solid var(--ios-separator);
  border-radius:var(--ios-radius-sm);
  font-size:15px;
  line-height:1.6;
  resize:vertical;
  background:var(--ios-gray6);
  color:var(--ios-text);
}
.copy-field-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}
.copy-field-chk{
  padding:6px 12px;
  border:1px solid var(--ios-separator);
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  background:var(--ios-card);
  color:var(--ios-text);
}
.copy-field-chk.checked{
  background:var(--ios-blue);
  color:#fff;
  border-color:var(--ios-blue);
}
.copy-dialog-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
  justify-content:flex-end;
}

/* 收藏星标 */
.fav-btn{
  width:32px;height:32px;border:none;background:var(--ios-gray6);border-radius:50%;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
  color:var(--ios-gray);transition:all .15s;
}
.fav-btn:active{transform:scale(0.9)}
.fav-btn.active{color:#ffcc00}

/* 批量选择 */
.select-bar{
  position:fixed;bottom:0;left:0;width:100%;background:var(--ios-card-elevated);
  padding:14px 20px;display:none;z-index:80;justify-content:space-between;align-items:center;
  box-shadow:0 -2px 20px rgba(0,0,0,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.select-bar.show{display:flex}
.select-count{font-size:16px;font-weight:600;color:var(--ios-text)}
.select-actions{display:flex;gap:10px}
.select-actions .btn{padding:10px 20px;font-size:15px}
.btn-batch-copy{background:var(--ios-blue);color:#fff}
.btn-batch-clear{background:var(--ios-gray6);color:var(--ios-blue)}
.card-check{
  width:24px;height:24px;border:2px solid var(--ios-gray5);border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;transition:all .15s;flex-shrink:0;
}
.card-check.checked{background:var(--ios-blue);border-color:var(--ios-blue);color:#fff}

/* 表格入口 */
.table-card{background:var(--ios-card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tc-name{font-size:16px;font-weight:700;color:var(--ios-text);margin-bottom:14px;line-height:1.45;word-break:break-all}
.tc-btns{display:flex;gap:10px;flex-wrap:wrap}
.tc-btn{flex:1;min-width:140px;text-align:center;padding:13px 12px;border-radius:11px;text-decoration:none;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.tc-btn:active{transform:scale(.96)}
.tc-open{background:var(--ios-blue);color:#fff;width:100%;box-sizing:border-box}
.tc-dl{background:var(--ios-green);color:#fff}
.tc-copy{background:var(--ios-gray5);color:var(--ios-text);border:none;cursor:pointer;font-family:inherit}
.tc-copy:active{transform:scale(.96)}

/* 二维码弹窗 */
.qr-img{display:block;margin:12px auto;max-width:200px;width:200px;height:200px;border-radius:var(--ios-radius-sm)}

/* 价格区间筛选 */
.price-range{display:flex;gap:8px;align-items:center;margin-top:6px}
.price-range input{
  width:70px;padding:6px 10px;border:1px solid var(--ios-separator);border-radius:var(--ios-radius-xs);
  font-size:14px;text-align:center;background:var(--ios-card);color:var(--ios-text);
}
.price-range span{color:var(--ios-text-sub)}
.price-range-btn{padding:6px 14px;background:var(--ios-blue);color:#fff;border:none;border-radius:var(--ios-radius-xs);font-size:13px;cursor:pointer}
@media(max-width:600px){
  .container{padding:12px;padding-bottom:80px}
  .top-bar h1{font-size:24px}
  .search-wrap{padding:14px}
  #searchBox{font-size:16px}
  .btn{padding:12px 16px;font-size:16px}
  .card{padding:14px}
  .sn-text{font-size:20px}
}
</style>
</head>
<body>
<div class="container">
<div class="top-bar">
  <h1>🔍 瀚客尔产品查询器</h1>
  <div class="top-icons">
    <button class="top-icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    <button class="top-icon-btn" id="adminBtn" onclick="toggleAdmin()" title="切换模式">🔒</button>
    <button class="top-icon-btn" onclick="showContactCard()" title="联系方式">📞</button>
  </div>
</div>

<div class="search-area">
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="款号 / 关键词 / 拼音首字母（如 hsc→华棉）..." oninput="doSearch()" autofocus/>
    <button class="btn btn-search" onclick="doSearch()">搜索</button>
    <button class="btn btn-clear" onclick="doClear()">清空</button>
  </div>
  <div class="filter-toggle" onclick="toggleFilter()">
    <span id="filterIcon">▸</span> <span>高级筛选</span> <span id="filterCount" style="color:var(--primary);font-weight:600"></span>
  </div>
  <div class="filter-panel" id="filterPanel">
    <div class="filter-group">
      <span class="filter-label">品类</span>
      <div class="filter-tags" id="filterCategory"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">面料</span>
      <div class="filter-tags" id="filterFabric"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">其他</span>
      <div class="filter-tags" id="filterOther"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">价格区间（分销价）</span>
      <div class="price-range">
        <input type="number" id="priceMin" placeholder="最低" min="0">
        <span>—</span>
        <input type="number" id="priceMax" placeholder="最高" min="0">
        <button class="price-range-btn" onclick="applyPriceRange()">筛选</button>
        <button class="price-range-btn" style="background:var(--ios-gray6);color:var(--ios-blue)" onclick="clearPriceRange()">清除</button>
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn btn-clear" onclick="clearFilters()">重置筛选</button>
      <button class="btn btn-search" onclick="toggleFilter()">完成</button>
    </div>
  </div>
</div>

<div class="nav-area" id="navArea"></div>
<div class="total-bar">共 <span class="total-num" id="totalCount">0</span> 款产品</div>
<div id="results"></div>
</div>

function esc(s){return !s?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function daysSince(dateStr){
  if(!dateStr)return 999;
  var d=new Date(dateStr);
  var now=new Date();
  return Math.floor((now-d)/(1000*60*60*24));
}

function isNew(p){
  return daysSince(p.first_added)<=90;
}

/* ===== 价格解析 ===== */
function parsePrice(priceStr, stockStr){
  if(!priceStr&&!stockStr)return {display:'',supplyPrice:0,ctrlPrice:0,smallPrice:0,largePrice:0};
  var s=(priceStr||'').trim();
  var stock=(stockStr||'').trim();
  var result={display:s,supplyPrice:0,ctrlPrice:0,smallPrice:0,largePrice:0};
  
  // 提取控价（优先从price字段，没有则从stock字段）
  var allText=s+' '+stock;
  var ctrlMatch=allText.match(/控价\s*(\d+)/);
  if(ctrlMatch)result.ctrlPrice=parseInt(ctrlMatch[1]);
  
  // 提取小码大码
  var smMatch=s.match(/小码\s*(\d+)/);
  var lgMatch=s.match(/大码\s*(\d+)/);
  if(smMatch)result.smallPrice=parseInt(smMatch[1]);
  if(lgMatch)result.largePrice=parseInt(lgMatch[1]);
  
  // M-5XL / 6XL-8XL 格式
  if(!result.smallPrice){
    var m1=s.match(/(\d+)\s*[\(【\[]?\s*M[-‐–]5XL/);
    if(m1)result.smallPrice=parseInt(m1[1]);
  }
  if(!result.largePrice){
    var m2=s.match(/(\d+)\s*[\(【\[]?\s*6XL[-‐–]8XL/);
    if(m2)result.largePrice=parseInt(m2[1]);
  }
  
  // 单一分销价：提取"控价"前的数字，或开头的数字
  if(!result.smallPrice&&!result.largePrice){
    // 控价前的价格（如"36（控价69）"）
    var beforeCtrl=s.match(/^(\d+)\s*[（(]/);
    if(beforeCtrl){
      result.supplyPrice=parseInt(beforeCtrl[1]);
    }else{
      // 空格分隔（如"31 控价69"）
      var spacePrice=s.match(/^(\d+)\s+/);
      if(spacePrice)result.supplyPrice=parseInt(spacePrice[1]);
      else{
        // 纯数字
        var single=s.match(/^(\d+)$/);
        if(single)result.supplyPrice=parseInt(single[1]);
      }
    }
  }
  
  return result;
}

function renderPrice(pp, internal, rawPrice){
  if(!pp)return '';
  
  // 内部模式：显示原价格字段
  if(internal && rawPrice){
    return '<span class="price-val">'+esc(rawPrice)+'</span>';
  }
  
  // 外部模式：拆分分销价和控价，分开展示
  var supplyParts=[];
  if(pp.smallPrice)supplyParts.push('小码¥'+pp.smallPrice);
  if(pp.largePrice)supplyParts.push('大码¥'+pp.largePrice);
  if(!pp.smallPrice && !pp.largePrice && pp.supplyPrice)supplyParts.push('¥'+pp.supplyPrice);
  
  var h='';
  if(supplyParts.length>0){
    h+='<span style="color:#2563eb;font-weight:700">分销价 '+supplyParts.join(' ')+'</span>';
  }
  if(pp.ctrlPrice){
    if(h)h+='<span style="color:#999;margin:0 6px">|</span>';
    h+='<span style="color:#dc2626;font-weight:700">控价 ¥'+pp.ctrlPrice+'</span>';
  }
  if(!h && rawPrice){
    h='<span class="price-val">'+esc(rawPrice)+'</span>';
  }
  return h || '';
}

function matchFilters(p){
  if(p.discontinued)return false;
  var f=STATE.filters;
  if(f.category.length===0&&f.fabric.length===0&&f.other.length===0&&!f.priceMin&&!f.priceMax)return true;
  
  var reg=p.regular||{},fl=p.fleece||{};
  var allText=[p.sn,reg.name,reg.colors,reg.sizes,reg.fabric,fl.name,fl.fabric].join(' ').toLowerCase();
  
  // 品类筛选
  for(var i=0;i<f.category.length;i++){
    if(allText.indexOf(f.category[i].toLowerCase())===-1)return false;
  }
  // 面料筛选
  for(var i=0;i<f.fabric.length;i++){
    if(allText.indexOf(f.fabric[i].toLowerCase())===-1)return false;
  }
  // 其他筛选
  for(var i=0;i<f.other.length;i++){
    var cond=f.other[i];
    if(cond==='有加绒款'&&!p.fleece)return false;
    if(cond==='有网盘链接'&&!reg.url&&!fl.url)return false;
    if(cond==='TOP排行'&&!p.autumn_ranking&&!p.summer_ranking)return false;
  }
  // 价格区间筛选
  if(f.priceMin>0||f.priceMax>0){
    var pp=parsePrice(reg.price||'',reg.stock||'');
    var price=pp.supplyPrice||pp.smallPrice||0;
    if(!price&&pp.largePrice)price=pp.largePrice;
    if(f.priceMin>0&&price<f.priceMin)return false;
    if(f.priceMax>0&&price>f.priceMax)return false;
  }
  return true;
}

/* ===== 搜索 ===== */
function doSearch(){
  var q=document.getElementById('searchBox').value.trim().toLowerCase();
  if(!q){renderAll();return}
  var f=[];
  for(var i=0;i<DATA.length;i++){
    var p=DATA[i];
    var reg=p.regular||{},fl=p.fleece||{};
    var t=[p.sn,reg.name,reg.colors,reg.sizes,reg.fabric,reg.price,reg.url,
           fl.name,fl.colors,fl.sizes,fl.fabric,fl.price].join(' ').toLowerCase();
    if(p.variants)t+=' '+p.variants.join(' ').toLowerCase();
    if(t.indexOf(q)!==-1&&matchFilters(p))f.push(p);
  }
  renderResults(f);
}

window._navQ=function(key){
  STATE.activeNav=key;
  document.querySelectorAll('.nav-btn').forEach(function(el){
    el.classList.toggle('active',el.getAttribute('data-nav')===key);
  });
  document.getElementById('searchBox').value='';
  
  if(key==='全部'){renderAll();return}
  if(key==='收藏'){
    var favs=DATA.filter(function(p){return isFav(p.sn)&&matchFilters(p)});
    renderResults(favs,'⭐ 收藏');
    return;
  }
  if(key==='夏季TOP'){doShowSummerTop();return}
  if(key==='秋季TOP'){doShowAutumnTop();return}
  if(key==='秋季新款'){doShowAutumnNew();return}
  if(key==='表格'){doShowTables();return}
  
  // 品类导航
  var navItem=null;
  for(var i=0;i<NAV_ITEMS.length;i++){if(NAV_ITEMS[i].key===key){navItem=NAV_ITEMS[i];break}}
  if(navItem&&navItem.keywords){
    var f=[];
    for(var j=0;j<DATA.length;j++){
      var p=DATA[j];
      var reg=p.regular||{},fl=p.fleece||{};
      var t=navItem.fabricOnly?[reg.fabric,fl.fabric].join(' ').toLowerCase()
            :[p.sn,reg.name,reg.fabric,fl.name,fl.fabric].join(' ').toLowerCase();
      var hit=false;
      for(var ki=0;ki<navItem.keywords.length;ki++){if(t.indexOf(navItem.keywords[ki].toLowerCase())!==-1){hit=true;break}}
      if(hit&&navItem.exclude){
        var allNames=[(reg.name||''),(fl.name||'')].join(' ').toLowerCase();
        for(var ei=0;ei<navItem.exclude.length;ei++){if(allNames.indexOf(navItem.exclude[ei].toLowerCase())!==-1){hit=false;break}}
      }
      if(hit&&navItem.excludeSn){
        for(var si=0;si<navItem.excludeSn.length;si++){if(p.sn===navItem.excludeSn[si]){hit=false;break}}
      }
      if(hit&&matchFilters(p))f.push(p);
    }
    renderResults(f);
    return;
  }
  // 默认搜索
  document.getElementById('searchBox').value=key;
  doSearch();
};

function urlRow(sec){

function renderSection(reg,isFleece){
  if(!reg)reg={name:'',colors:'',sizes:'',fabric:'',price:'',stock:'',url:'',pwd:''};
  var cls=isFleece?'section fleece':'section';
  var tag=isFleece?'<span class="type-tag type-fl">加绒款</span>':'<span class="type-tag type-reg">常规款</span>';
  
  var h='<div class="'+cls+'"><div class="name-row"><span class="name-text">'+esc(reg.name||'无品名')+'</span>'+tag+'</div>';
  if(reg.colors)h+='<div class="info-row"><span class="info-label">颜色</span><span class="info-value">'+esc(reg.colors)+'</span></div>';
  if(reg.sizes)h+='<div class="info-row"><span class="info-label">尺码</span><span class="info-value">'+esc(reg.sizes)+'</span></div>';
  if(reg.fabric)h+='<div class="info-row"><span class="info-label">成分</span><span class="info-value">'+esc(reg.fabric)+'</span></div>';
  if(reg.price)h+='<div class="info-row"><span class="info-label">价格</span><span class="info-value">'+renderPrice(parsePrice(reg.price,reg.stock), isInternal(), reg.price)+'</span></div>';
  if(reg.stock&&isInternal())h+='<div class="info-row"><span class="info-label">库存</span><span class="info-value">'+esc(reg.stock)+'</span></div>';
  h+=urlRow(reg);

  return h;
}

function makeCard(p){
  var v='';
  if(p.variants&&p.variants.length)v='<span class="variant-hint">('+p.variants.join('/')+')</span>';
  
  var badges='';
  if(p.ranking)badges+='<span class="badge badge-top">TOP'+p.ranking.rank+'</span>';
  if(p.summer_ranking)badges+='<span class="badge badge-summer">夏季TOP'+p.summer_ranking.rank+'</span>';
  if(p.autumn_ranking)badges+='<span class="badge badge-autumn">秋季TOP'+p.autumn_ranking.rank+'</span>';
  if(p.unshipped)badges+='<span class="badge badge-unshipped">未出货</span>';
  if(p.autumn_new)badges+='<span class="badge badge-autumnnew">🌿 26年秋季新品</span>';
  
  var favCls=isFav(p.sn)?' active':'';
  var selCls=STATE.selected.indexOf(p.sn)>=0?' checked':'';
  
  var snLine='<div class="sn-row"><div class="sn-left">'+
    '<div class="card-check'+selCls+'" onclick="window._toggleSelect(\''+esc(p.sn)+'\')" data-sel="'+esc(p.sn)+'">✓</div>'+
    '<span class="sn-text">'+esc(p.sn)+'</span>'+v+badges+'</div>'+
    '<div class="sn-actions">'+
    '<button class="fav-btn'+favCls+'" onclick="window._toggleFav(\''+esc(p.sn)+'\')" data-fav="'+esc(p.sn)+'" title="收藏">⭐</button>'+
    '</div></div>';
  
  var body=renderSection(p.regular,false);
  if(p.fleece)body+=renderSection(p.fleece,true);
  
  var regUrl=p.regular&&p.regular.url?p.regular.url:'';
  var flUrl=p.fleece&&p.fleece.url?p.fleece.url:'';
  var detailBtns='';
  if(regUrl)detailBtns+='<a href="'+esc(regUrl)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:10px 14px;background:var(--ios-green);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;flex:1;justify-content:center">🖼️ 常规款详情</a>';
  if(flUrl)detailBtns+='<a href="'+esc(flUrl)+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:10px 14px;background:var(--ios-orange);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;flex:1;justify-content:center">🖼️ 加绒款详情</a>';
  
  var hasLink = regUrl || flUrl;
  var copyBar='<div class="copy-bar">'+
    '<button class="copy-btn copy-all" data-sn="'+esc(p.sn)+'" onclick="window._doCopy(this)">📋 复制全部</button>'+
    (hasLink?'<button class="copy-btn copy-link" data-sn="'+esc(p.sn)+'" onclick="window._doCopyLink(this)">🔗 复制链接</button>':'')+
    '<button class="copy-btn copy-share" data-sn="'+esc(p.sn)+'" onclick="window._doCopySelect(this)">⚙️ 选择复制</button>'+
    '</div>';
  
  if(detailBtns)copyBar='<div style="display:flex;gap:8px;margin-top:8px">'+detailBtns+'</div>'+copyBar;
  
  return '<div class="card" id="card-'+esc(p.sn)+'">'+snLine+body+copyBar+'</div>';

var PAGE_SIZE=24;
var _curList=null,_curRendered=0;
function renderResults(list,label){
  list=list.filter(function(p){return !p.discontinued;});
  var d=document.getElementById('results');
  var c=document.getElementById('totalCount');
  c.textContent=list.length+' 款'+(label?'（'+label+'）':'');
  if(list.length===0){
    d.innerHTML='<div class="empty">🔍 未找到匹配的产品，请尝试其他关键词</div>';
    _curList=null; _curRendered=0; return;
  }
  _curList=list; _curRendered=0;
  d.innerHTML='';
  _appendBatch(d);
  checkHashLocation();
}
function _appendBatch(d){
  d=d||document.getElementById('results');
  if(!d||!_curList)return;
  var slice=_curList.slice(_curRendered,_curRendered+PAGE_SIZE);
  if(slice.length){
    d.insertAdjacentHTML('beforeend',slice.map(function(p){return makeCard(p)}).join(''));
    _curRendered+=slice.length;
  }
  var old=d.querySelector('.load-more');
  if(old)old.parentNode.removeChild(old);
  if(_curRendered<_curList.length){
    var btn=document.createElement('button');
    btn.className='load-more';
    btn.textContent='⬇️ 加载更多（还剩 '+(_curList.length-_curRendered)+' 款）';
    btn.style.cssText='display:block;width:100%;margin:14px auto 4px;padding:12px;border:1px solid rgba(127,127,127,.3);background:rgba(127,127,127,.10);color:inherit;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer';
    btn.onclick=function(){_appendBatch(d);};
    d.appendChild(btn);
  }
}

function snNum(s){
  var m=String(s).match(/\d+/);
  return m?parseInt(m[0],10):1e9;
}
function renderAll(){
  var filtered=DATA.filter(matchFilters);
  // 「全部」优先展示26秋季新品（autumn_new 置顶），同组按款号数字升序
  filtered.sort(function(a,b){
    if(!!a.autumn_new!==!!b.autumn_new)return a.autumn_new?-1:1;
    return snNum(a.sn)-snNum(b.sn);
  });
  renderResults(filtered);
}

function renderCurrent(){
  if(STATE.activeNav==='全部'&&!document.getElementById('searchBox').value){
    renderAll();
  }else{
    doSearch();
  }
}

/* ===== URL Hash定位 ===== */
function checkHashLocation(){
  var hash=window.location.hash;
  if(hash&&hash.startsWith('#sn=')){
    var sn=hash.substring(4);
    var el=document.getElementById('card-'+sn);
    if(!el&&_curList){
      // 目标卡片尚未渲染（懒加载场景），先全量渲染再定位
      var d=document.getElementById('results');
      d.innerHTML=_curList.map(function(p){return makeCard(p)}).join('');
      _curRendered=_curList.length;
      var old=d.querySelector('.load-more');
      if(old)old.parentNode.removeChild(old);
      el=document.getElementById('card-'+sn);
    }
    if(el){
      el.classList.add('highlight');
      el.scrollIntoView({behavior:'smooth',block:'center'});
      // 3秒后消除高亮
      setTimeout(function(){el.classList.remove('highlight')},3000);
    }
  }
}

    if(reg.sizes)lines.push('尺码：'+reg.sizes);

    if(reg.url)lines.push('网盘：'+reg.url+(reg.pwd?' 提取码:'+reg.pwd:''));
    if(p.fleece){

/* ===== 复制功能 ===== */
var COPY_FIELDS=[
  {key:'sn',label:'款号'},
  {key:'name',label:'品名'},
  {key:'colors',label:'颜色'},
  {key:'sizes',label:'尺码'},
  {key:'fabric',label:'成分'},
  {key:'price',label:'价格'},
  {key:'stock',label:'库存'},
  {key:'url',label:'网盘链接'}
];

window._doCopy=function(btn){

  });
};

function findProduct(sn){
  for(var i=0;i<DATA.length;i++){if(DATA[i].sn===sn)return DATA[i]}
  return null;
}

function buildCopyText(p,fields,format){
  var reg=p.regular||{},fl=p.fleece||{};
  var lines=[];
  
  if(format==='table'){
    // Tab分隔格式，可粘贴到Excel
    var row1=[],row2=[];
    for(var i=0;i<fields.length;i++){
      var f=fields[i];
      if(f==='sn'){row1.push('款号');row2.push(p.sn)}
      else{
        var label=COPY_FIELDS.find(function(c){return c.key===f});
        if(!label)continue;
        row1.push(label.label);
        row2.push(reg[f]||'');
      }
    }
    if(p.fleece){
      row1.push('（加绒）品名');row2.push(fl.name||'');
      for(var i=0;i<fields.length;i++){
        var f=fields[i];
        if(f==='sn')continue;
        var label=COPY_FIELDS.find(function(c){return c.key===f});
        if(!label)continue;
        row1.push('（加绒）'+label.label);
        row2.push(fl[f]||'');
      }
    }
    return row1.join('\t')+'\n'+row2.join('\t');
  }
  
  if(format==='share'){
    // 微信分享格式（简洁版）
    var s='【款号】'+p.sn+'\n';
    s+='【品名】'+(reg.name||'')+'\n';
    if(fields.indexOf('colors')>=0&&reg.colors)s+='【颜色】'+reg.colors+'\n';
    if(fields.indexOf('sizes')>=0&&reg.sizes)s+='【尺码】'+reg.sizes+'\n';
    if(fields.indexOf('fabric')>=0&&reg.fabric)s+='【成分】'+reg.fabric+'\n';
    if(isInternal()&&fields.indexOf('price')>=0&&reg.price)s+='【价格】'+reg.price+'\n';
    if(fields.indexOf('url')>=0&&reg.url)s+='【详情页】'+reg.url+(reg.pwd?' 提取码:'+reg.pwd:'');
    if(p.fleece){
      s+='\n\n【加绒款】\n品名：'+(fl.name||'')+'\n';
      if(fields.indexOf('colors')>=0&&fl.colors)s+='颜色：'+fl.colors+'\n';
      if(isInternal()&&fields.indexOf('price')>=0&&fl.price)s+='价格：'+fl.price+'\n';
      if(fields.indexOf('url')>=0&&fl.url)s+='详情页：'+fl.url+(fl.pwd?' 提取码:'+fl.pwd:'');
    }
    return s;
  }
  
  // 默认文本格式
  lines.push('款号：'+p.sn);
  if(p.variants&&p.variants.length)lines.push('变体：'+p.variants.join(' / '));
  lines.push('');
  lines.push('【常规款】');
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    if(f==='sn')continue;
    var label=COPY_FIELDS.find(function(c){return c.key===f});
    if(!label)continue;
    if(reg[f])lines.push(label.label+'：'+reg[f]);
  }
  if(p.fleece){
    lines.push('');
    lines.push('【加绒款】');
    for(var i=0;i<fields.length;i++){
      var f=fields[i];
      if(f==='sn')continue;
      var label=COPY_FIELDS.find(function(c){return c.key===f});
      if(!label)continue;
      if(fl[f])lines.push(label.label+'：'+fl[f]);
    }
  }
  return lines.join('\n');
}

function buildLinkOnlyText(p){
  var reg=p.regular||{},fl=p.fleece||{};
  var lines=[];
  lines.push('款号：'+p.sn);
  if(reg.url)lines.push('网盘：'+reg.url+(reg.pwd?' 提取码:'+reg.pwd:''));
  if(p.fleece){
    if(fl.url){
      lines.push('');
      lines.push('【加绒款】');
      lines.push('款号：'+p.sn+'（加绒）');
      lines.push('网盘：'+fl.url+(fl.pwd?' 提取码:'+fl.pwd:''));
    }
  }
  return lines.join('\n');
}

function showCopyOverlay(text,title,onSuccess){
  var ov=document.createElement('div');
  ov.className='copy-overlay';
  ov.innerHTML='<div class="copy-dialog">'+
    '<div class="copy-dialog-header"><span class="copy-dialog-title">'+title+'</span><button class="copy-dialog-close" onclick="this.closest(\'.copy-overlay\').remove()">&times;</button></div>'+
    '<textarea class="copy-textarea" id="copyTxt" readonly>'+esc(text)+'</textarea>'+
    '<div class="copy-dialog-actions"><button class="btn btn-search" onclick="var t=document.getElementById(\'copyTxt\');t.select();document.execCommand(\'copy\');this.textContent=\'✅ 已复制\';setTimeout(function(){document.querySelector(\'.copy-overlay\').remove()},1500)">📋 复制</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  // 自动尝试复制
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      if(onSuccess)onSuccess();
      setTimeout(function(){if(ov.parentNode)ov.remove()},1000);
    }).catch(function(){});
  }
}

function showSelectCopyDialog(p,btn){
  var ov=document.createElement('div');
  ov.className='copy-overlay';
  
  var fieldsHtml=COPY_FIELDS.map(function(f){
    // 对外模式隐藏价格和库存
    if(!isInternal()&&(f.key==='price'||f.key==='stock'))return '';
    return '<span class="copy-field-chk checked" data-field="'+f.key+'" onclick="this.classList.toggle(\'checked\')">'+f.label+'</span>';
  }).join('');
  
  var formatsHtml='<div class="copy-format-tabs">'+
    '<span class="format-tab active" data-fmt="text" onclick="window._setFmt(this)">文本</span>'+
    '<span class="format-tab" data-fmt="table" onclick="window._setFmt(this)">表格(粘Excel)</span>'+
    '<span class="format-tab" data-fmt="share" onclick="window._setFmt(this)">微信分享</span>'+
    '</div>';
  
  ov.innerHTML='<div class="copy-dialog">'+
    '<div class="copy-dialog-header"><span class="copy-dialog-title">⚙️ 选择复制内容 - 款号'+esc(p.sn)+'</span><button class="copy-dialog-close" onclick="this.closest(\'.copy-overlay\').remove()">&times;</button></div>'+
    '<div style="font-size:12px;color:var(--text-sub);margin-bottom:6px">选择要复制的字段：</div>'+
    '<div class="copy-field-list">'+fieldsHtml+'</div>'+
    '<div style="font-size:12px;color:var(--text-sub);margin-bottom:6px">复制格式：</div>'+
    formatsHtml+
    '<textarea class="copy-textarea" id="copyTxt" readonly></textarea>'+
    '<div class="copy-dialog-actions"><button class="btn btn-clear" onclick="this.closest(\'.copy-overlay\').remove()">取消</button><button class="btn btn-search" onclick="window._doSelectCopy(\''+esc(p.sn)+'\',this)">📋 复制</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  
  window._currentFmt='text';
  window._setFmt=function(el){
    document.querySelectorAll('.format-tab').forEach(function(t){t.classList.remove('active')});
    el.classList.add('active');
    window._currentFmt=el.getAttribute('data-fmt');
    window._previewCopy(p.sn);
  };
  window._previewCopy=function(sn){
    var prod=findProduct(sn);
    if(!prod)return;
    var fields=[];
    document.querySelectorAll('.copy-field-chk.checked').forEach(function(el){
      fields.push(el.getAttribute('data-field'));
    });
    if(fields.indexOf('sn')<0)fields.unshift('sn');
    var text=buildCopyText(prod,fields,window._currentFmt);
    document.getElementById('copyTxt').value=text;
  };
  window._doSelectCopy=function(sn,btn){
    var ta=document.getElementById('copyTxt');
    ta.select();
    document.execCommand('copy');
    btn.textContent='✅ 已复制';
    if(btn2)btn2.textContent='✅ 已复制';
    setTimeout(function(){ov.remove()},1500);
  };
  
  // 初始预览
  window._previewCopy(p.sn);
}

window._copyText=function(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      alert('已复制：'+text);
    }).catch(function(){
      _fallbackCopy(text);
    });
  }else{
    _fallbackCopy(text);
  }
};
function _fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  try{document.execCommand('copy');alert('已复制：'+text)}catch(e){alert('复制失败，请手动复制：'+text)}
  document.body.removeChild(ta);
}
